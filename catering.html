<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Catering</title>
<meta name="theme-color" content="#E9E8E4">
<link rel="manifest" href="catering-manifest.json">
<link rel="apple-touch-icon" href="catering-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catering">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9E8E4;--ink:#17181B;--muted:#686B70;--line:#DEDDD8;--soft:#F4F3F0;--ok:#1F6B3A;--err:#A3202A;--wa:#1F8F4E;--blue:#1E3A8A;--blue-soft:#EAEFFA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px 40px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.eyebrow{color:var(--muted);font-size:14px;margin:4px 4px 2px}
h1{font-size:26px;line-height:1.15;margin:0 4px 14px;letter-spacing:-.015em}
h2{font-size:15px;margin:0 0 10px}
.lab{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.f{margin-bottom:14px}.f:last-child{margin-bottom:0}
input[type=text],input[type=date]{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;outline:none;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,58,138,.12)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{flex:1 1 40%;min-height:40px;border:none;border-radius:9px;background:transparent;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:center;padding:9px 13px;border:1px solid var(--line);border-radius:20px;font-size:14px;cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:12px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.ferr{color:#A3202A;font-size:13px;font-weight:600;margin:6px 2px 0}.bad input[type=text]{border-color:#A3202A}.bad .seg{box-shadow:0 0 0 1.5px #A3202A}
.btn.danger{background:#fff;color:#A3202A;border:1.5px solid #E7C3C6;margin-top:12px}.row .btn.danger{margin-top:0;background:#A3202A;color:#fff;border:none}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:14px;border:none;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none}
.main{background:var(--ink);color:#fff}.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}.wa{background:var(--wa);color:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.err{background:#FBECEC;color:var(--err);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.fine{text-align:center;padding:34px 20px}.fine .big{font-size:24px;font-weight:700}
pre{white-space:pre-wrap;word-break:break-all;font:inherit;font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--soft);cursor:pointer}.list .it:first-child{border-top:none}
.it .t{flex:1;min-width:0}.it b{display:block;font-size:15px}.it small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nums div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}.nums b{display:block;font-size:22px}.nums span{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#FBECEC;color:var(--err);white-space:nowrap}
.link{background:none;border:none;color:var(--blue);font-weight:600;font-size:15px;padding:8px 0;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:50}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="fb-catering.js"></script>
<script>
window.API_URL = "https://script.google.com/macros/s/AKfycbxuOnDHJY_1vsG9MTow36k-aiQJkvr8yw09bHlwlm3A1Xo8_UHSjB_fqTtdJKW1XoKhHQ/exec";
(function(){
  var Q = new URLSearchParams(location.search);
  var EV = (Q.get('e') || '').trim().slice(0, 80), FINO = (Q.get('f') || '').slice(0, 10), PRJ = (Q.get('p') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 20), KEY = (Q.get('k') || '').replace(/[^a-z0-9]/g, '');
  var app = document.getElementById('app');
  var BASE = location.origin + location.pathname;
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var DIETE = ['Mangio tutto', 'Vegetariana', 'Vegana', 'Pescetariana'];
  var ALL = ['Glutine', 'Lattosio', 'Frutta a guscio', 'Crostacei e pesce', 'Uova'];
  var dieta = '';
  function toast(m){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2600); }
  function copia(t, m){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast(m || 'Copiato'); }, function(){ var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast(m || 'Copiato'); }); }
  function api(fn, args){
    return fetch(window.API_URL, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function(r){ return r.json(); }).then(function(j){ if (j.err) throw new Error(j.err); return j.data; });
  }
  var fmt = function(iso){ return iso ? iso.split('-').reverse().join('/') : ''; };
  var CID = (Q.get('c') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 40);
  var ADMIN = 'simonemanfredaa@gmail.com';
  var linkModulo = function(x){ return BASE + '?c=' + x.id; };
  var giorniDa = function(iso){ return Math.floor((Date.now() - new Date(iso + 'T12:00:00').getTime()) / 864e5); };
  var isoDi = function(ts){ try { var d = ts && ts.toDate ? ts.toDate() : new Date(); return d.toISOString().slice(0, 10); } catch (e) { return ''; } };

  // ── stato in tempo reale (Firebase) ──
  var U = null, ME = null, PROD = [], RIS = {}, VISTA = null, STOP = [];
  function ferma(){ STOP.forEach(function(f){ try { f(); } catch (e) {} }); STOP = []; }
  function ridisegna(){ if (VISTA) VISTA(); }

  function avvia(){
    var F = window.FB;
    app.innerHTML = '<div class="card"><p class="muted" style="margin:0">Un attimo…</p></div>';
    F.onAuthStateChanged(F.auth, function(u){
      ferma(); U = u; ME = null;
      if (!u) return vLogin();
      var email = (u.email || '').toLowerCase();
      var entra = function(nome, admin){
        ME = { email: email, nome: nome || u.displayName || email, admin: admin };
        ascolta(); vHome();
      };
      if (email === ADMIN) return entra(u.displayName || 'Simone Manfreda', true);
      F.getDoc(F.doc(F.db, 'producer', email)).then(function(d){
        if (!d.exists()) return vNonAbilitato(email);
        entra(d.data().nome, false);
      }).catch(function(){ vNonAbilitato(email); });
    });
  }
  function ascolta(){
    var F = window.FB;
    STOP.push(F.onSnapshot(F.query(F.collection(F.db, 'produzioni'), F.where('eliminata', '==', false)), function(qs){
      PROD = qs.docs.map(function(d){ var v = d.data(); return { id: d.id, e: v.nome, f: v.inizio || '', da: v.creataNome || '', creata: v.creata, pulita: !!v.pulita, conteggi: v.conteggi || null }; })
        .sort(function(a, b){ return (b.f || '9').localeCompare(a.f || '9') || a.e.localeCompare(b.e, 'it'); });
      pulizia(); ridisegna();
    }, function(err){ mostraErrore(err); }));
    STOP.push(F.onSnapshot(F.collectionGroup(F.db, 'risposte'), function(qs){
      RIS = {};
      qs.docs.forEach(function(d){ var p = d.ref.parent.parent.id, v = d.data(); (RIS[p] = RIS[p] || []).push({ id: d.id, nome: v.nome || '', dieta: v.dieta || '', allergie: v.allergie || '', altro: v.altro || '', grave: !!v.grave }); });
      ridisegna();
    }, function(err){ mostraErrore(err); }));
  }
  function mostraErrore(err){ console.warn(err); toast(/permission/i.test(err && err.code || '') ? 'Accesso non permesso' : 'Problema di connessione: riprovo da solo'); }

  // privacy: 45 giorni dopo l'inizio (o dalla creazione se manca la data) restano solo i numeri
  var PULITE = {};
  function pulizia(){
    var F = window.FB;
    PROD.forEach(function(x){
      var rif = x.f || isoDi(x.creata);
      if (x.pulita || PULITE[x.id] || !rif || giorniDa(rif) <= 45) return;
      PULITE[x.id] = 1;
      F.getDocs(F.collection(F.db, 'produzioni', x.id, 'risposte')).then(function(qs){
        var r = qs.docs.map(function(d){ return d.data(); }), c = conta(r), b = F.writeBatch(F.db);
        qs.docs.forEach(function(d){ b.delete(d.ref); });
        b.update(F.doc(F.db, 'produzioni', x.id), { pulita: true, conteggi: c });
        return b.commit();
      }).catch(function(e){ console.warn('pulizia', e); });
    });
  }
  function conta(r){
    var c = function(t){ return r.filter(function(y){ return y.dieta === t; }).length; };
    return { totale: r.length, tutto: c('Mangio tutto'), vegetariani: c('Vegetariana'), vegani: c('Vegana'), pescetariani: c('Pescetariana'), allergie: r.filter(function(y){ return y.allergie || y.altro || y.grave; }).length };
  }

  // ── accesso ──
  function vLogin(msg){
    VISTA = null;
    app.innerHTML = '<p class="eyebrow">Catering</p><h1>Accedi</h1><div class="card">' + (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
      '<button class="btn main" id="gg">Accedi con Google</button><p class="muted" style="margin:10px 0 0">Usa l\'account Google che Simone ha abilitato.</p></div>';
    document.getElementById('gg').onclick = function(){
      var F = window.FB, b = this; b.disabled = true; b.textContent = 'Apro Google…';
      F.signInWithPopup(F.auth, new F.GoogleAuthProvider()).catch(function(e){
        b.disabled = false; b.textContent = 'Accedi con Google';
        if (!/popup-closed|cancelled-popup/.test(e.code || '')) vLogin('Accesso non riuscito (' + (e.code || e.message) + '). Riprova.');
      });
    };
  }
  function vNonAbilitato(email){
    VISTA = null;
    app.innerHTML = '<p class="eyebrow">Catering</p><h1>Account non abilitato</h1><div class="card"><p style="margin:0 0 12px">L\'account <b>' + esc(email) + '</b> non è ancora tra i producer.</p><p class="muted" style="margin:0 0 14px">Chiedi a Simone di aggiungerlo, poi riapri l\'app.</p><button class="btn sec" id="out">Usa un altro account</button></div>';
    document.getElementById('out').onclick = esci;
  }
  function esci(){ ferma(); PROD = []; RIS = {}; window.FB.signOut(window.FB.auth); }

  // ── home: tutte le produzioni ──
  function vHome(){
    VISTA = disegnaHome;
    app.innerHTML = '<div class="top"><span class="muted">' + esc(ME.nome) + '</span><span>' + (ME.admin ? '<button class="link" id="team">Producer</button> ' : '') + '<button class="link" id="out">Esci</button></span></div><p class="eyebrow">Catering</p><h1>Produzioni</h1>' +
      '<div id="lst"></div><button class="btn main" id="nuova">+ Nuova produzione</button>';
    document.getElementById('nuova').onclick = vCrea;
    document.getElementById('out').onclick = esci;
    if (ME.admin) document.getElementById('team').onclick = vProducer;
    disegnaHome();
  }
  function disegnaHome(){
    var el = document.getElementById('lst'); if (!el) return;
    el.innerHTML = PROD.length ? '<div class="card list" style="padding:2px 16px">' + PROD.map(function(x, i){
      var n = x.pulita && x.conteggi ? x.conteggi.totale : (RIS[x.id] || []).length;
      var info = [x.f ? 'shoot dal ' + fmt(x.f) : 'senza data', n + (n === 1 ? ' risposta' : ' risposte'), x.da ? 'di ' + x.da : ''].filter(Boolean).join(' · ');
      return '<div class="it" data-i="' + i + '"><div class="t"><b>' + esc(x.e) + '</b><small>' + esc(info) + '</small></div><span style="color:#B9BBBF;font-size:22px">›</span></div>'; }).join('') + '</div>' :
      '<div class="card"><p class="muted" style="margin:0">Nessuna produzione. Creane una: ti do il link da mandare a crew, clienti e ospiti, e le risposte arrivano qui.</p></div>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-i]'), function(it){ it.onclick = function(){ vEvento(PROD[Number(it.dataset.i)].id); }; });
  }
  function vCrea(){
    VISTA = null;
    app.innerHTML = '<div class="top"><button class="link" id="ind">‹ Indietro</button></div><h1>Nuova produzione</h1>' +
      '<form id="crea" class="card" autocomplete="off"><div class="f"><label class="lab" for="ev">Nome della produzione</label><input type="text" id="ev" placeholder="Es. Alain Mikli N1"></div>' +
      '<div class="f"><label class="lab" for="fi">Inizio shoot</label><input type="date" id="fi"></div>' +
      '<button class="btn main" type="submit">Crea</button><p class="muted" style="margin:10px 0 0">Serve per la privacy: 45 giorni dopo l\'inizio dello shoot le risposte si cancellano da sole e restano solo i numeri.</p></form>';
    document.getElementById('ind').onclick = vHome;
    document.getElementById('crea').addEventListener('submit', function(e){
      e.preventDefault();
      var F = window.FB, ev = document.getElementById('ev').value.trim().slice(0, 80), fi = document.getElementById('fi').value;
      if (ev.length < 2) return toast('Scrivi il nome della produzione');
      var ref = F.doc(F.collection(F.db, 'produzioni'));
      F.setDoc(ref, { nome: ev, inizio: fi, creataNome: ME.nome, creataDa: ME.email, creata: F.serverTimestamp(), eliminata: false, pulita: false }).catch(function(err){ toast('Non salvata: ' + err.message); });
      PROD.unshift({ id: ref.id, e: ev, f: fi, da: ME.nome });
      vEvento(ref.id, true);
    });
  }
  // ── una produzione ──
  function trova(id){ return PROD.filter(function(x){ return x.id === id; })[0]; }
  function vEvento(id, nuova){
    var x = trova(id); if (!x) return vHome();
    var msg = 'Ciao! Per ' + x.e + ' ci dici cosa mangi e se hai allergie o intolleranze? Ci vuole un minuto: ' + linkModulo(x);
    app.innerHTML = '<div class="top"><button class="link" id="ind">‹ Produzioni</button><button class="link" id="mod">Modifica</button></div>' +
      '<p class="eyebrow">Catering' + (x.f ? ' · shoot dal ' + fmt(x.f) : '') + '</p><h1>' + esc(x.e) + '</h1>' +
      '<div class="card"><h2>' + (nuova ? 'Pronta! Ora manda il link' : 'Link da mandare') + '</h2><pre>' + esc(linkModulo(x)) + '</pre>' +
      '<div class="row"><button class="btn sec" id="cp">Copia</button><a class="btn wa" href="whatsapp://send?text=' + encodeURIComponent(msg) + '">WhatsApp</a></div></div>' +
      '<div id="ris"></div><button class="btn main" id="pdf" style="margin-top:4px">Scarica il PDF per il catering</button>';
    document.getElementById('ind').onclick = vHome;
    document.getElementById('cp').onclick = function(){ copia(linkModulo(x), 'Link copiato'); };
    document.getElementById('mod').onclick = function(){ vModifica(id); };
    document.getElementById('pdf').onclick = function(){ scaricaPdf(id, this); };
    VISTA = function(){ disegnaRisposte(id); };
    disegnaRisposte(id);
  }
  function vModifica(id){
    var x = trova(id); if (!x) return vHome();
    VISTA = null;
    app.innerHTML = '<div class="top"><button class="link" id="ind">‹ Indietro</button></div><h1>Modifica produzione</h1>' +
      '<form id="frm" class="card" autocomplete="off"><div class="f"><label class="lab" for="ev">Nome della produzione</label><input type="text" id="ev" value="' + esc(x.e) + '"></div>' +
      '<div class="f"><label class="lab" for="fi">Inizio shoot</label><input type="date" id="fi" value="' + esc(x.f || '') + '"></div>' +
      '<button class="btn main" type="submit">Salva modifiche</button><p class="muted" style="margin:10px 0 0">Il link già mandato continua a funzionare.</p></form>' +
      '<div id="del"><button class="btn danger" id="eli">Elimina produzione</button></div>';
    document.getElementById('ind').onclick = function(){ vEvento(id); };
    document.getElementById('frm').addEventListener('submit', function(e){
      e.preventDefault();
      var F = window.FB, ev = document.getElementById('ev').value.trim().slice(0, 80), fi = document.getElementById('fi').value;
      if (ev.length < 2) return toast('Scrivi il nome della produzione');
      F.updateDoc(F.doc(F.db, 'produzioni', id), { nome: ev, inizio: fi }).catch(function(err){ toast('Non salvata: ' + err.message); });
      x.e = ev; x.f = fi; toast('Modifiche salvate'); vEvento(id);
    });
    document.getElementById('eli').onclick = function(){
      document.getElementById('del').innerHTML = '<div class="card"><h2>Eliminare «' + esc(x.e) + '»?</h2><p class="muted" style="margin:0 0 12px">Il link smette di funzionare e le risposte vengono cancellate subito. Non si può annullare.</p>' +
        '<div class="row"><button class="btn sec" id="no">Annulla</button><button class="btn danger" id="si">Elimina</button></div></div>';
      document.getElementById('no').onclick = function(){ vModifica(id); };
      document.getElementById('si').onclick = function(){
        var F = window.FB, b = this; b.disabled = true; b.textContent = 'Elimino…';
        var r = RIS[id] || [], c = conta(r);
        F.getDocs(F.collection(F.db, 'produzioni', id, 'risposte')).then(function(qs){
          var bt = F.writeBatch(F.db);
          qs.docs.forEach(function(d){ bt.delete(d.ref); });
          bt.update(F.doc(F.db, 'produzioni', id), { eliminata: true, pulita: true, conteggi: c });
          return bt.commit();
        }).then(function(){ toast('Produzione eliminata'); vHome(); })
          .catch(function(err){ b.disabled = false; b.textContent = 'Elimina'; toast(err.message); });
      };
    };
  }
  function ordina(r){ var w = function(x){ return x.grave ? 0 : (x.allergie || x.altro) ? 1 : 2; }; return r.slice().sort(function(a, b){ return w(a) - w(b) || a.nome.localeCompare(b.nome, 'it'); }); }
  function disegnaRisposte(id){
    var el = document.getElementById('ris'); if (!el) return;
    var x = trova(id) || {}, r = RIS[id] || [];
    var c = x.pulita && x.conteggi ? x.conteggi : conta(r);
    el.innerHTML = '<div class="card"><div class="nums"><div><b>' + c.totale + '</b><span>risposte</span></div><div><b>' + c.vegetariani + '</b><span>vegetariani</span></div><div><b>' + c.vegani + '</b><span>vegani</span></div>' +
      '<div><b>' + c.pescetariani + '</b><span>pescetariani</span></div><div><b>' + c.tutto + '</b><span>mangiano tutto</span></div><div><b>' + c.allergie + '</b><span>con allergie</span></div></div></div>' +
      (r.length ? '<div class="card list" style="padding:2px 16px">' + ordina(r).map(function(y){
        return '<div class="it" style="cursor:default"><div class="t"><b>' + esc(y.nome) + '</b><small>' + esc([y.dieta, y.allergie, y.altro].filter(Boolean).join(' · ')) + '</small></div>' + (y.grave ? '<span class="badge">allergia grave</span>' : '') + '</div>';
      }).join('') + '</div>' : '<div class="card"><p class="muted" style="margin:0">' + (x.pulita ? 'Le risposte sono state cancellate per la privacy: restano solo i numeri.' : 'Ancora nessuna risposta. Appena qualcuno compila, compare qui da solo.') + '</p></div>');
  }

  // ── PDF fatto sul telefono ──
  function caricaPdfLib(){
    return window.PDFLIB ? Promise.resolve(window.PDFLIB) : new Promise(function(ok, ko){ var s = document.createElement('script'); s.src = 'pdf-catering.js'; s.onload = function(){ ok(window.PDFLIB); }; s.onerror = ko; document.head.appendChild(s); });
  }
  function scaricaPdf(id, b){
    var x = trova(id), r = ordina(RIS[id] || []), c = x.pulita && x.conteggi ? x.conteggi : conta(RIS[id] || []);
    b.disabled = true; b.textContent = 'Preparo il PDF…';
    caricaPdfLib().then(function(L){
      var d = new L.jsPDF({ unit: 'pt', format: 'a4' }), oggi = new Date().toLocaleDateString('it-IT');
      d.setFont('helvetica', 'bold'); d.setFontSize(20); d.text('Catering · ' + x.e, 40, 56);
      d.setFont('helvetica', 'normal'); d.setFontSize(10); d.setTextColor(104, 107, 112);
      d.text(c.totale + ' risposte' + (x.f ? ' · inizio shoot ' + fmt(x.f) : '') + ' · aggiornato al ' + oggi, 40, 74);
      var box = [['Totale', c.totale], ['Mangiano tutto', c.tutto], ['Vegetariani', c.vegetariani], ['Vegani', c.vegani], ['Pescetariani', c.pescetariani], ['Allergie o note', c.allergie]], bx = 40;
      box.forEach(function(v){ var w = d.getTextWidth(v[0]) + 20; d.setDrawColor(210); d.roundedRect(bx, 88, w, 40, 4, 4); d.setTextColor(23, 24, 27); d.setFont('helvetica', 'bold'); d.setFontSize(14); d.text(String(v[1]), bx + 10, 106); d.setFont('helvetica', 'normal'); d.setFontSize(9); d.text(v[0], bx + 10, 120); bx += w + 6; });
      L.autoTable(d, { startY: 144, head: [['Nome', 'Dieta', 'Allergie e intolleranze', 'Note']],
        body: r.map(function(y){ return [y.nome + (y.grave ? '  GRAVE' : ''), y.dieta, y.allergie, y.altro]; }),
        styles: { font: 'helvetica', fontSize: 10, cellPadding: 6, textColor: [23, 24, 27], lineColor: [227, 227, 227], lineWidth: { bottom: .5 } },
        headStyles: { fillColor: false, textColor: [104, 107, 112], fontSize: 8.5, fontStyle: 'bold', lineWidth: { bottom: 1.2 }, lineColor: [23, 24, 27] },
        columnStyles: { 0: { cellWidth: 140 }, 1: { cellWidth: 90 }, 2: { cellWidth: 160, textColor: [163, 32, 42], fontStyle: 'bold' }, 3: { cellWidth: 125 } },
        didParseCell: function(h){ if (h.section !== 'body') return; var y = r[h.row.index]; if (y.grave) h.cell.styles.fillColor = [248, 215, 218]; else if (y.allergie || y.altro) h.cell.styles.fillColor = [252, 237, 238]; }
      });
      if (c.allergie) { d.setFontSize(8.5); d.setTextColor(104, 107, 112); d.text('In rosso chi ha allergie, intolleranze o note: sono in cima all\'elenco. GRAVE = allergia grave.', 40, d.lastAutoTable.finalY + 18); }
      var nome = 'Catering_' + x.e.replace(/[^\w\-]+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.pdf';
      var file = new File([d.output('blob')], nome, { type: 'application/pdf' }), u = URL.createObjectURL(file);
      var puo = navigator.canShare && navigator.canShare({ files: [file] });
      var bx2 = document.createElement('div'); bx2.className = 'card'; bx2.id = 'pdfbox';
      bx2.innerHTML = '<h2 style="margin-bottom:4px">PDF pronto</h2><p class="muted" style="margin:0 0 10px">' + esc(nome) + '</p>' +
        '<div class="row"><a class="btn main" id="sv" href="' + u + '" download="' + esc(nome) + '">Salva il PDF</a>' + (puo ? '<button class="btn sec" id="sh">Invia…</button>' : '') + '</div>' +
        '<p class="muted" style="margin:10px 0 0">Salvalo e allegalo alla mail o al messaggio per il catering.' + (puo ? ' Con «Invia…» lo mandi subito da Mail, WhatsApp o Messaggi.' : '') + '</p>';
      var old = document.getElementById('pdfbox'); if (old) old.remove();
      b.parentNode.insertBefore(bx2, b);
      b.disabled = false; b.textContent = 'Rifai il PDF con le ultime risposte'; b.className = 'btn sec';
      if (puo) document.getElementById('sh').onclick = function(){ navigator.share({ files: [file], title: nome }).catch(function(){}); };
      bx2.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }).catch(function(err){ b.disabled = false; b.textContent = 'Scarica il PDF per il catering'; toast('PDF non riuscito: ' + (err && err.message || 'connessione')); });
  }

  // ── producer abilitati (solo admin) ──
  function vProducer(){
    var F = window.FB;
    VISTA = null;
    app.innerHTML = '<div class="top"><button class="link" id="ind">‹ Produzioni</button></div><h1>Producer</h1>' +
      '<div class="card" id="pl"><p class="muted" style="margin:0">Carico…</p></div>' +
      '<form id="pf" class="card" autocomplete="off"><h2>Aggiungi un producer</h2><div class="f"><label class="lab" for="pn">Nome</label><input type="text" id="pn" placeholder="Es. Filippo Mogno"></div>' +
      '<div class="f"><label class="lab" for="pe">Email Google</label><input type="text" id="pe" inputmode="email" autocapitalize="off" placeholder="nome@gmail.com"></div><button class="btn main" type="submit">Aggiungi</button></form>';
    document.getElementById('ind').onclick = vHome;
    var lista = function(){
      F.getDocs(F.collection(F.db, 'producer')).then(function(qs){
        var el = document.getElementById('pl'); if (!el) return;
        el.className = 'card list'; el.style.padding = '2px 16px';
        el.innerHTML = '<div class="it" style="cursor:default"><div class="t"><b>' + esc(ME.nome) + '</b><small>' + esc(ADMIN) + ' · admin</small></div></div>' +
          qs.docs.map(function(d){ return '<div class="it" style="cursor:default"><div class="t"><b>' + esc(d.data().nome) + '</b><small>' + esc(d.id) + '</small></div><button class="link" style="color:#A3202A" data-del="' + esc(d.id) + '">Togli</button></div>'; }).join('');
        Array.prototype.forEach.call(el.querySelectorAll('[data-del]'), function(b){ b.onclick = function(){ F.deleteDoc(F.doc(F.db, 'producer', b.dataset.del)).then(function(){ toast('Tolto'); lista(); }); }; });
      }).catch(function(err){ toast(err.message); });
    };
    lista();
    document.getElementById('pf').addEventListener('submit', function(e){
      e.preventDefault();
      var n = document.getElementById('pn').value.trim(), m = document.getElementById('pe').value.trim().toLowerCase();
      if (n.length < 2 || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) return toast('Scrivi nome ed email');
      F.setDoc(F.doc(F.db, 'producer', m), { nome: n }).then(function(){ toast('Aggiunto: ora può accedere con Google'); vProducer(); }).catch(function(err){ toast(err.message); });
    });
  }

  // ── modulo crew su Firebase (link ?c=…) ──
  function vModuloFB(){
    var F = window.FB;
    app.innerHTML = '<div class="card"><p class="muted" style="margin:0">Un attimo…</p></div>';
    F.getDoc(F.doc(F.db, 'produzioni', CID)).then(function(d){
      if (!d.exists() || d.data().eliminata) { app.innerHTML = '<div class="card fine"><div class="big">Link non più attivo</div><p class="muted" style="margin:10px 0 0">Chiedi un link nuovo a chi te l\'ha mandato.</p></div>'; return; }
      EV = d.data().nome; vModulo();
    }).catch(function(){ app.innerHTML = '<div class="card fine"><div class="big">Connessione assente</div><p class="muted" style="margin:10px 0 0">Controlla internet e riapri il link.</p></div>'; });
  }

  // ── modulo per chi risponde ──
  function vModulo(err){
    app.innerHTML = '<p class="eyebrow">Catering · ' + esc(EV) + '</p><h1>Cosa mangi sul set?</h1>' + (err ? '<div class="err">' + esc(err) + '</div>' : '') +
      '<form id="mod" autocomplete="off" novalidate><div class="card"><div class="f" id="f-nm"><label class="lab" for="nm">Nome e cognome</label><input type="text" id="nm" autocomplete="name" required aria-describedby="e-nm"><p class="ferr" id="e-nm" hidden>Scrivi nome e cognome</p></div>' +
      '<div class="f" id="f-seg"><span class="lab" id="l-seg">Cosa mangi</span><div class="seg" id="seg" role="radiogroup" aria-labelledby="l-seg">' + DIETE.map(function(t){ return '<button type="button" role="radio" aria-checked="' + (t === dieta) + '" data-d="' + t + '" class="' + (t === dieta ? 'on' : '') + '">' + t + '</button>'; }).join('') + '</div><p class="ferr" id="e-seg" hidden>Scegli cosa mangi</p></div>' +
      '<div class="f"><span class="lab">Allergie o intolleranze</span><div class="chips">' + ALL.map(function(t){ return '<label class="chip"><input type="checkbox" name="al" value="' + t + '">' + t + '</label>'; }).join('') + '</div></div>' +
      '<div class="f"><label class="lab" for="al">Altro</label><input type="text" id="al" placeholder="Es. niente funghi"></div>' +
      '<label class="chk"><input type="checkbox" id="gr">Ho un\'allergia grave: avvisate il catering</label></div>' +
      '<button class="btn main" type="submit">Invia</button><p class="muted" style="margin:10px 4px;text-align:center">Le risposte vanno solo al catering di questa produzione.</p></form>';
    document.getElementById('seg').addEventListener('click', function(e){
      var b = e.target.closest('[data-d]'); if (!b) return;
      dieta = b.dataset.d; Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
      segna('seg', false);
    });
    document.getElementById('nm').addEventListener('input', function(){ if (this.value.trim().length >= 2 && /\s/.test(this.value.trim())) segna('nm', false); });
    document.getElementById('mod').addEventListener('submit', function(e){
      e.preventDefault();
      var d = { e: EV, f: FINO, p: PRJ, nome: document.getElementById('nm').value.trim(), dieta: dieta,
        allergie: Array.prototype.map.call(document.querySelectorAll('input[name=al]:checked'), function(i){ return i.value; }),
        altro: document.getElementById('al').value.trim(), grave: document.getElementById('gr').checked };
      var okN = d.nome.length >= 2 && /\s/.test(d.nome), okD = !!d.dieta;
      segna('nm', !okN); segna('seg', !okD);
      if (!okN || !okD) { (okN ? document.getElementById('seg') : document.getElementById('nm')).scrollIntoView({ behavior: 'smooth', block: 'center' }); if (!okN) document.getElementById('nm').focus(); return; }
      app.innerHTML = '<div class="card fine"><div class="big">Grazie, ricevuto!</div><p class="muted" style="margin:10px 0 0">Lo giro al catering. Ci vediamo sul set.</p></div>';
      if (CID) {
        var F = window.FB;
        F.addDoc(F.collection(F.db, 'produzioni', CID, 'risposte'), { nome: d.nome.slice(0, 80), dieta: d.dieta, allergie: d.allergie.join(', '), altro: d.altro.slice(0, 300), grave: d.grave, quando: F.serverTimestamp() })
          .catch(function(err){ ripristina(d, 'La risposta non è arrivata (' + (err.code || err.message) + '). Riprova.'); });
        return;
      }
      api('catInvia', [d]).then(function(r){ if (!r.ok) ripristina(d, r.msg); }).catch(function(err){ ripristina(d, err.message === 'Failed to fetch' ? 'Connessione assente: la risposta non è arrivata. Riprova.' : err.message); });
    });
  }
  function segna(id, male){
    var f = document.getElementById('f-' + id), e = document.getElementById('e-' + id); if (!f) return;
    f.classList.toggle('bad', male); e.hidden = !male;
  }
  function ripristina(d, msg){
    dieta = d.dieta; vModulo(msg);
    document.getElementById('nm').value = d.nome; document.getElementById('al').value = d.altro; document.getElementById('gr').checked = d.grave;
    Array.prototype.forEach.call(document.querySelectorAll('input[name=al]'), function(i){ i.checked = d.allergie.indexOf(i.value) !== -1; });
  }

  if (CID) vModuloFB();
  else if (EV && !KEY) vModulo();   // link vecchi e link dai progetti Troupe: passano ancora da Google
  else avvia();
})();
</script>
