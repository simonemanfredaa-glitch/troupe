  // privacy: 45 giorni dopo l'inizio (o dalla creazione se manca la data) restano solo i numeri

  // ── una produzione ──

  // Legge le righe riconosciute da una foto di crew list: nome, telefono, ruolo, giorni.
  function leggiCrewDaRighe(lines, anno){
    var MESI = { gen: 0, feb: 1, mar: 2, apr: 3, mag: 4, giu: 5, lug: 6, ago: 7, set: 8, ott: 9, nov: 10, dic: 11 };
    var reMese = /(gen|feb|mar|apr|mag|giu|lug|ago|set|ott|nov|dic)/i;
    var righe = lines.map(function(ws){
      ws = ws.filter(function(w){ return w.t && w.t.trim(); }).sort(function(a, b){ return a.b.x0 - b.b.x0; });
      if (!ws.length) return null;
      var h = ws.map(function(w){ return w.b.y1 - w.b.y0; }).sort(function(a, b){ return a - b; })[Math.floor(ws.length / 2)] || 20;
      var celle = [], cur = null;
      ws.forEach(function(w){
        if (cur && w.b.x0 - cur.x1 < h * 1.3) { cur.t += ' ' + w.t; cur.x1 = w.b.x1; }
        else { cur = { t: w.t, x0: w.b.x0, x1: w.b.x1 }; celle.push(cur); }
      });
      celle.forEach(function(c){
        var s = c.t.trim();
        c.tipo = /@/.test(s) ? 'mail' : /^\+?[\d\s.\/-]{8,}$/.test(s) && (s.match(/\d/g) || []).length >= 8 ? 'tel' : /\d/.test(s) && reMese.test(s) && s.length < 25 ? 'data' : 'testo';
      });
      // telefono spezzato in più celle ("+39" "3381399560")
      for (var i = 0; i < celle.length - 1; i++) if (/^\+?\d{2,4}$/.test(celle[i].t.trim()) && celle[i + 1].tipo === 'tel') { celle[i + 1].t = celle[i].t + ' ' + celle[i + 1].t; celle[i + 1].x0 = celle[i].x0; celle.splice(i, 1); i--; }
      return { celle: celle, h: h };
    }).filter(Boolean);
    // colonna dei nomi: la cella prima del telefono, nelle righe che ce l'hanno
    var xs = [];
    righe.forEach(function(r){ var i = r.celle.findIndex(function(c){ return c.tipo === 'tel'; }); if (i > 0 && r.celle[i - 1].tipo === 'testo') xs.push(r.celle[i - 1].x0); });
    if (!xs.length) return [];
    xs.sort(function(a, b){ return a - b; }); var xN = xs[Math.floor(xs.length / 2)];
    var titolo = function(s){ return /[a-zà-ÿ]/.test(s) ? s : s.toLowerCase().replace(/(^|[\s'’-])(\p{L})/gu, function(m, a, b){ return a + b.toUpperCase(); }); };
    var out = [];
    righe.forEach(function(r){
      var iN = r.celle.findIndex(function(c){ return c.tipo === 'testo' && Math.abs(c.x0 - xN) < r.h * 3; });
      if (iN === -1) return;
      var nome = r.celle[iN].t.replace(/[|_]/g, '').replace(/['’`´]{2,}/g, '’').replace(/\s+/g, ' ').trim();
      if (!/\p{L}{2,}/u.test(nome)) return;
      var tel = (r.celle.filter(function(c){ return c.tipo === 'tel'; })[0] || {}).t || '';
      var ruolo = r.celle.slice(0, iN).filter(function(c){ return c.tipo === 'testo'; }).map(function(c){ return c.t; }).join(' ').replace(/\s+-\s*|\s*-\s+/g, ' - ').trim();
      var dataT = r.celle.filter(function(c){ return c.tipo === 'data'; }).map(function(c){ return c.t; }).join(' ');
      var giorni = [], m, re = /(\d{1,2}(?:\s*\/\s*\d{1,2})*)\s*(gen|feb|mar|apr|mag|giu|lug|ago|set|ott|nov|dic)/gi;
      while ((m = re.exec(dataT))) m[1].split('/').forEach(function(n){ var d = new Date(anno, MESI[m[2].toLowerCase()], +n); giorni.push(d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2)); });
      var parti = titolo(nome).split(/\s+/);
      out.push({ n: parti.length > 1 ? parti.slice(0, -1).join(' ') : parti[0], c: parti.length > 1 ? parti[parti.length - 1] : '', tel: tel.replace(/\s+/g, ' ').trim(), ruolo: ruolo, giorni: giorni });
    });
    return out;
  }

  function leggiFoto(id, file, giorniU, pv, salva){

  function anteprimaFile(id, rows, giorniU, pv, salva){

          headStyles: { fillColor: false, textColor: [104, 107, 112], fontSize: 8.5, fontStyle: 'bold', lineWidth: { bottom: 1.2 }, lineColor: [23, 24, 27] },
          columnStyles: { 0: { cellWidth: 140 }, 1: { cellWidth: 90 }, 2: { cellWidth: 160, textColor: [163, 32, 42], fontStyle: 'bold' }, 3: { cellWidth: 125 } },
          didParseCell: function(h){ if (h.section !== 'body') return; var y = r[h.row.index]; if (y.grave) h.cell.styles.fillColor = [248, 215, 218]; else if (y.allergie || y.altro) h.cell.styles.fillColor = [252, 237, 238]; }
        });
      };
      if (sv.length <= 1) {
        testata('Catering · ' + x.e, periodo(x) + ' · aggiornato al ' + oggi);
        tabella(tutte, blocco(conta(tutte), 128));
      } else {
        // pagina 1: riepilogo per servizio
        testata('Catering · ' + x.e, periodo(x) + ' · riepilogo · aggiornato al ' + oggi);
        var perServ = sv.map(function(s){ return { s: s, r: V.filter(function(v){ return presente(v.r, s.k, v.p); }).map(function(v){ return v.r; }) }; });
        L.autoTable(d, { theme: 'plain', startY: 96, head: [['Giorno', 'Pasto', 'Persone', 'Tutto', 'Vege', 'Vegan', 'Pesce', 'Allergie']],
          body: perServ.map(function(q){ var c = conta(q.r); return [nomeGiorno(q.s.d) + '/' + (dataDi(q.s.d).getMonth() + 1), q.s.pasto === 'cena' ? 'Cena' : 'Pranzo', c.totale, c.tutto, c.vegetariani, c.vegani, c.pescetariani, c.allergie]; }),
          styles: { font: 'helvetica', fontSize: 10.5, cellPadding: 6, textColor: [23, 24, 27], lineColor: [227, 227, 227], lineWidth: { bottom: .5 } },
          headStyles: { fillColor: false, textColor: [104, 107, 112], fontSize: 8.5, fontStyle: 'bold', lineWidth: { bottom: 1.2 }, lineColor: [23, 24, 27] },
          columnStyles: { 2: { fontStyle: 'bold' }, 7: { textColor: [163, 32, 42], fontStyle: 'bold' } } });
        var manca = voci(id).filter(function(v){ return !v.r; }).map(nomeVoce);
        if (manca.length) { d.setFontSize(9); d.setTextColor(104, 107, 112); d.text(d.splitTextToSize('In crew ma senza risposta (non contati): ' + manca.join(', ') + '.', 515), 40, d.lastAutoTable.finalY + 18); }
        // una pagina per servizio
        perServ.forEach(function(q){
          d.addPage();
          testata(nomeGiorno(q.s.d) + '/' + (dataDi(q.s.d).getMonth() + 1) + ' · ' + (q.s.pasto === 'cena' ? 'Cena' : 'Pranzo'), 'Catering · ' + x.e);
          tabella(q.r, blocco(conta(q.r), 128));
        });
      }
      var nome = 'Catering_' + x.e.replace(/[^\w\-]+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.pdf';
      var file = new File([d.output('blob')], nome, { type: 'application/pdf' }), u = URL.createObjectURL(file);
      var puo = navigator.canShare && navigator.canShare({ files: [file] });
      var bx2 = document.createElement('div'); bx2.className = 'card'; bx2.id = 'pdfbox';
      bx2.innerHTML = '<h2 style="margin-bottom:4px">PDF pronto</h2><p class="muted" style="margin:0 0 10px">' + esc(nome) + '</p>' +
        '<div class="row"><a class="btn main" id="sv" href="' + u + '" download="' + esc(nome) + '">Salva il PDF</a>' + (puo ? '<button class="btn sec" id="sh2">Invia…</button>' : '') + '</div>' +
        '<p class="muted" style="margin:10px 0 0">Salvalo e allegalo alla mail o al messaggio per il catering.' + (puo ? ' Con «Invia…» lo mandi subito da Mail, WhatsApp o Messaggi.' : '') + '</p>';
      var old = document.getElementById('pdfbox'); if (old) old.remove();
      var az = document.getElementById('az'); az.parentNode.insertBefore(bx2, az);
      b.disabled = false; b.textContent = 'Rifai PDF';
      if (puo) document.getElementById('sh2').onclick = function(){ navigator.share({ files: [file], title: nome }).catch(function(){}); };
      bx2.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }).catch(function(err){ b.disabled = false; b.textContent = 'PDF catering'; toast('PDF non riuscito: ' + (err && err.message || 'connessione')); });
  }

  // ── producer abilitati (solo admin) ──
  function vProducer(){
    var F = window.FB;
    VISTA = null;
    app.innerHTML = '<div class="top"><button class="link" id="ind">‹ Produzioni</button></div><h1>Producer</h1>' +
      '<div class="card" id="pl"><p class="muted" style="margin:0">Carico…</p></div>' +
      '<form id="pf" class="card" autocomplete="off"><h2>Aggiungi un producer</h2><p class="muted" style="margin:-4px 0 10px">Vede e gestisce tutte le produzioni, come te. Per far vedere una sola produzione usa il link di invito dentro la produzione.</p><div class="f"><label class="lab" for="pn">Nome</label><input type="text" id="pn" placeholder="Es. Mario Rossi"></div>' +
      '<div class="f"><label class="lab" for="pe">Email Google</label><input type="text" id="pe" inputmode="email" autocapitalize="off" placeholder="nome@gmail.com"></div><button class="btn main" type="submit">Aggiungi</button></form>' +
      '<form id="imp" class="card" autocomplete="off"><h2>Porta qui le produzioni vecchie</h2><p class="muted" style="margin:0 0 10px">Copia le produzioni create prima su Google, con le loro risposte. I link già mandati continuano a funzionare e da ora scrivono qui. Serve il tuo codice Troupe.</p>' +
      '<div class="f"><input type="password" id="ic" inputmode="numeric" placeholder="Codice Troupe" autocomplete="one-time-code"></div><button class="btn sec" type="submit">Importa</button><div id="ir"></div></form>';
    document.getElementById('ind').onclick = vHome;
    document.getElementById('imp').addEventListener('submit', function(e){ e.preventDefault(); importa(this); });
    var lista = function(){
      F.getDocs(F.collection(F.db, 'producer')).then(function(qs){
        var el = document.getElementById('pl'); if (!el) return;
        el.className = 'card list'; el.style.padding = '2px 16px';
        el.innerHTML = '<div class="it" style="cursor:default"><div class="t"><b>Simone Manfreda</b><small>' + esc(ADMIN) + ' · admin</small></div></div>' +
          qs.docs.map(function(d){ return '<div class="it" style="cursor:default"><div class="t"><b>' + esc(d.data().nome) + '</b><small>' + esc(d.id) + '</small></div><button class="link" style="color:#A3202A" data-del="' + esc(d.id) + '">Togli</button></div>'; }).join('');
        Array.prototype.forEach.call(el.querySelectorAll('[data-del]'), function(b){ b.onclick = function(){ F.deleteDoc(F.doc(F.db, 'producer', b.dataset.del)).then(function(){ toast('Tolto'); lista(); }); }; });
      }).catch(function(err){ toast(err.message); });
    };
    lista();
    document.getElementById('pf').addEventListener('submit', function(e){
      e.preventDefault();
      var n = document.getElementById('pn').value.trim(), m = document.getElementById('pe').value.trim().toLowerCase();
      if (n.length < 2 || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) return toast('Scrivi nome ed email');
      F.setDoc(F.doc(F.db, 'producer', m), { nome: n }).then(function(){ toast('Aggiunto: ora può accedere con Google'); vProducer(); }).catch(function(err){ toast(err.message); });
    });
  }

  function importa(form){
    var F = window.FB, b = form.querySelector('button'), out = document.getElementById('ir'), code = document.getElementById('ic').value.trim();
    if (!code) return toast('Scrivi il codice Troupe');
    b.disabled = true; b.textContent = 'Importo…';
    var fatte = 0, saltate = 0, risp = 0;
    api('entra', [code]).then(function(r){
      if (!r.ok) throw new Error(r.msg);
      return api('catElenco', [r.token]);
    }).then(function(l){
      return l.reduce(function(prom, v){
        return prom.then(function(){
          var al = F.doc(F.db, 'alias', chiaveNome(v.e));
          return F.getDoc(al).then(function(a){
            if (a.exists()) { saltate++; return; }
            var ref = F.doc(F.collection(F.db, 'produzioni'));
            return F.setDoc(ref, { nome: String(v.e).slice(0, 80), inizio: v.f || '', creataNome: v.da || ME.nome, creataDa: ME.email, creata: F.serverTimestamp(), eliminata: false, pulita: false })
              .then(function(){ return Promise.all((v.r || []).filter(function(y){ return y.nome && y.nome.length >= 3 && DIETE.indexOf(y.dieta) !== -1; }).map(function(y){
                risp++; return F.addDoc(F.collection(F.db, 'produzioni', ref.id, 'risposte'), { nome: y.nome.slice(0, 80), dieta: y.dieta, allergie: String(y.allergie || '').slice(0, 300), altro: String(y.altro || '').slice(0, 300), grave: !!y.grave, quando: F.serverTimestamp() });
              })); })
              .then(function(){ return F.setDoc(al, { c: ref.id }); })
              .then(function(){ fatte++; });
          });
        });
      }, Promise.resolve());
    }).then(function(){
      b.disabled = false; b.textContent = 'Importa';
      out.innerHTML = '<p class="muted" style="margin:10px 0 0">Fatto: ' + fatte + ' produzioni e ' + risp + ' risposte importate' + (saltate ? ', ' + saltate + ' già presenti' : '') + '.</p>';
    }).catch(function(err){ b.disabled = false; b.textContent = 'Importa'; out.innerHTML = '<div class="err" style="margin:10px 0 0">' + esc(err.message) + '</div>'; });
  }

  // ── modulo crew su Firebase (link ?c=…) ──
  function fine(t1, t2){ app.innerHTML = '<div class="card fine"><div class="big">' + esc(t1) + '</div><p class="muted" style="margin:10px 0 0">' + esc(t2) + '</p></div>'; }
  function vModuloFB(){
    var F = window.FB;
    app.innerHTML = '<div class="card"><p class="muted" style="margin:0">…</p></div>';
    F.getDoc(F.doc(F.db, 'produzioni', CID)).then(function(d){
      if (!d.exists() || d.data().eliminata) return fine(T('off'), T('off2'));
      var v = d.data(); EV = v.nome; MP = { id: CID, e: v.nome, f: v.inizio || '', giorni: v.giorni || [] };
      if (!UID) return vModulo();
      return F.getDoc(F.doc(F.db, 'produzioni', CID, 'crew', UID)).then(function(c){
        if (c.exists()) { var w = c.data(); PERS = { n: w.nome || '', c: w.cognome || '', g: w.giorni || [] }; }
        vModulo(); if (PERS) { document.getElementById('nm').value = PERS.n; document.getElementById('cg').value = PERS.c; }
      }).catch(function(){ vModulo(); });
    }).catch(function(){ fine(T('rete'), T('rete2')); });
  }
  // link vecchi (?e=Nome): se la produzione è stata importata su Firebase, uso quella
  function chiaveNome(n){ return String(n || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 80) || 'x'; }
  function vModuloVecchio(){
    var F = window.FB;
    if (PRJ || !F) return vModulo();
    F.getDoc(F.doc(F.db, 'alias', chiaveNome(EV))).then(function(d){ if (d.exists() && d.data().c) { CID = d.data().c; vModuloFB(); } else vModulo(); }).catch(function(){ vModulo(); });
  }
  function vModulo(err){
    var D = T('diete'), C = T('chips');
    app.innerHTML = '<div class="top"><p class="eyebrow" style="margin:0">Catering · ' + esc(EV) + '</p><span class="lang"><button data-l="it" class="' + (LG === 'it' ? 'on' : '') + '">IT</button><button data-l="en" class="' + (LG === 'en' ? 'on' : '') + '">EN</button></span></div>' +
      '<h1>' + esc(PERS && PERS.n ? T('ciao') + ' ' + PERS.n + ', ' + T('titolo').charAt(0).toLowerCase() + T('titolo').slice(1) : T('titolo')) + '</h1>' + (err ? '<div class="err">' + esc(err) + '</div>' : '') +
      '<form id="mod" autocomplete="off" novalidate><div class="card"><div class="f" id="f-nm"><label class="lab" for="nm">' + esc(T('nome')) + '</label><input type="text" id="nm" autocomplete="given-name" required aria-describedby="e-nm"><p class="ferr" id="e-nm" hidden>' + esc(T('eNome')) + '</p></div>' +
      '<div class="f" id="f-cg"><label class="lab" for="cg">' + esc(T('cognome')) + '</label><input type="text" id="cg" autocomplete="family-name" required aria-describedby="e-cg"><p class="ferr" id="e-cg" hidden>' + esc(T('eCognome')) + '</p></div>' +
      bloccoQuando() +
      '<div class="f" id="f-seg"><span class="lab" id="l-seg">' + esc(T('dieta')) + '</span><button type="button" class="dd" id="seg" aria-expanded="false" aria-labelledby="l-seg"><span id="v-seg">' + (dieta ? esc(D[DIETE.indexOf(dieta)]) : '<i>' + esc(T('scegli')) + '</i>') + '</span>' + CHEV + '</button>' +
        '<div class="ddl" id="l-dieta" role="radiogroup" hidden>' + DIETE.map(function(t, i){ return '<button type="button" class="op' + (t === dieta ? ' on' : '') + '" role="radio" aria-checked="' + (t === dieta) + '" data-d="' + t + '"><span>' + esc(D[i]) + '</span><span class="ck"></span></button>'; }).join('') + '</div><p class="ferr" id="e-seg" hidden>' + esc(T('eDieta')) + '</p></div>' +
      '<div class="f"><span class="lab" id="l-al">' + esc(T('all')) + '</span><button type="button" class="dd" id="ddal" aria-expanded="false" aria-labelledby="l-al"><span id="v-al"><i>' + esc(T('nessuna')) + '</i></span>' + CHEV + '</button>' +
        '<div class="ddl" id="l-all" hidden>' + ALL.map(function(t, i){ return '<label class="op"><span>' + esc(C[i]) + '</span><input type="checkbox" name="al" value="' + t + '"><span class="ck sq"></span></label>'; }).join('') + '</div></div>' +
      '<div class="f"><label class="lab" for="al">' + esc(T('altro')) + '</label><input type="text" id="al" placeholder="' + esc(T('ph')) + '"></div>' +
      '<label class="chk"><input type="checkbox" id="gr">' + esc(T('grave')) + '</label></div>' +
      '<button class="btn main" type="submit">' + esc(T('invia')) + '</button><p class="muted" style="margin:8px 4px;text-align:center;font-size:13px">' + esc(T('nota')) + '</p></form>';
    Array.prototype.forEach.call(app.querySelectorAll('[data-l]'), function(b){ b.onclick = function(){
      var d = leggi(); if (d.pasti) SCELTI = d.pasti; LG = b.dataset.l; vModulo(); rimetti(d);
    }; });
    var apri = function(btn, lista, su){ btn.onclick = function(){ var aperto = !lista.hidden; lista.hidden = aperto; btn.setAttribute('aria-expanded', !aperto); if (su) su(); }; };
    var ld = document.getElementById('l-dieta'), la = document.getElementById('l-all');
    apri(document.getElementById('seg'), ld, function(){ la.hidden = true; document.getElementById('ddal').setAttribute('aria-expanded', false); });
    apri(document.getElementById('ddal'), la, function(){ ld.hidden = true; document.getElementById('seg').setAttribute('aria-expanded', false); });
    ld.addEventListener('click', function(e){
      var b = e.target.closest('[data-d]'); if (!b) return;
      dieta = b.dataset.d; Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
      document.getElementById('v-seg').textContent = b.textContent; ld.hidden = true; document.getElementById('seg').setAttribute('aria-expanded', false);
      segna('seg', false);
    });
    la.addEventListener('change', riassumiAllergie);
    ['nm', 'cg'].forEach(function(k){ document.getElementById(k).addEventListener('input', function(){ if (this.value.trim().length >= 2) segna(k, false); }); });
    document.getElementById('mod').addEventListener('submit', function(e){
      e.preventDefault();
      var d = leggi();
      var okN = d.n1.length >= 2, okC = d.n2.length >= 2, okD = !!d.dieta, okQ = !d.pasti || d.pasti.length > 0;
      segna('nm', !okN); segna('cg', !okC); segna('seg', !okD); segna('qd', !okQ);
      if (!okN || !okC || !okD || !okQ) { var primo = !okN ? 'nm' : !okC ? 'cg' : !okQ ? 'f-qd' : 'seg'; document.getElementById(primo).scrollIntoView({ behavior: 'smooth', block: 'center' }); if (primo !== 'seg') document.getElementById(primo).focus(); return; }
      fine(T('grazie'), T('grazie2'));
      if (CID) {
        var F = window.FB;
        var dati = { nome: d.nome.slice(0, 80), dieta: d.dieta, allergie: d.allergie.join(', '), altro: d.altro.slice(0, 300), grave: d.grave, quando: F.serverTimestamp() };
        if (d.pasti) dati.pasti = d.pasti;
        if (UID) dati.crew = UID;
        (UID ? F.setDoc(F.doc(F.db, 'produzioni', CID, 'risposte', 'u_' + UID), dati) : F.addDoc(F.collection(F.db, 'produzioni', CID, 'risposte'), dati))
          .catch(function(err){ if (UID && /permission/i.test(err && err.code || '')) fine(T('gia'), T('gia2')); else ripristina(d, T('ko')); });
        return;
      }
      api('catInvia', [d]).then(function(r){ if (!r.ok) ripristina(d, r.msg); }).catch(function(){ ripristina(d, T('ko')); });
    });
  }
  // "Quando sei sul set?": solo se la produzione ha più giorni o pasti
  function bloccoQuando(){
    var sv = MP ? servizi(MP) : [];
    if (sv.length < 2) return '';
    if (!SCELTI) SCELTI = sv.filter(function(s){ return !PERS || !PERS.g.length || PERS.g.indexOf(s.d) !== -1; }).map(function(s){ return s.k; });
    return '<div class="f" id="f-qd"><span class="lab">' + esc(T('quando')) + '</span><div class="ddl" style="margin-top:0">' + sv.map(function(s){
      var d = dataDi(s.d), nome = (LG === 'en' ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] : GS)[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + ' · ' + T(s.pasto);
      return '<label class="op"><span>' + esc(nome) + '</span><input type="checkbox" name="qd" value="' + s.k + '"' + (SCELTI.indexOf(s.k) !== -1 ? ' checked' : '') + '><span class="ck sq"></span></label>'; }).join('') +
      '</div><p class="ferr" id="e-qd" hidden>' + esc(T('eQuando')) + '</p></div>';
  }
  function leggi(){
    var v = function(k){ var el = document.getElementById(k); return el ? el.value.trim().replace(/\s+/g, ' ') : ''; };
    var n1 = v('nm'), n2 = v('cg');
    return { e: EV, f: FINO, p: PRJ, n1: n1, n2: n2, nome: (n1 + ' ' + n2).trim(), dieta: dieta,
      allergie: Array.prototype.map.call(document.querySelectorAll('input[name=al]:checked'), function(i){ return i.value; }),
      altro: document.getElementById('al') ? document.getElementById('al').value.trim() : '', grave: !!(document.getElementById('gr') && document.getElementById('gr').checked),
      pasti: document.getElementById('f-qd') ? Array.prototype.map.call(document.querySelectorAll('input[name=qd]:checked'), function(i){ return i.value; }) : null };
  }
  function riassumiAllergie(){
    var C = T('chips'), sel = Array.prototype.map.call(document.querySelectorAll('input[name=al]:checked'), function(i){ return C[ALL.indexOf(i.value)]; });
    document.getElementById('v-al').innerHTML = sel.length ? esc(sel.join(', ')) : '<i>' + esc(T('nessuna')) + '</i>';
  }
  function rimetti(d){
    document.getElementById('nm').value = d.n1 || ''; document.getElementById('cg').value = d.n2 || ''; document.getElementById('al').value = d.altro; document.getElementById('gr').checked = d.grave;
    Array.prototype.forEach.call(document.querySelectorAll('input[name=al]'), function(i){ i.checked = d.allergie.indexOf(i.value) !== -1; });
    riassumiAllergie();
  }
  function segna(id, male){
    var f = document.getElementById('f-' + id), e = document.getElementById('e-' + id); if (!f) return;
    f.classList.toggle('bad', male); if (e) e.hidden = !male;
  }
  function ripristina(d, msg){ dieta = d.dieta; vModulo(msg); rimetti(d); }

  if (CID) vModuloFB();
  else if (INV) avvia();
  else if (EV && !KEY) vModuloVecchio();   // link vecchi e link dai progetti Troupe: passano ancora da Google
  else avvia();
})();
</script>
