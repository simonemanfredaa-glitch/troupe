<!DOCTYPE html>
<html lang="it">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Troupe">
<meta name="theme-color" content="#E9E8E4">
<script>window.API_URL = "https://script.google.com/macros/s/AKfycbxuOnDHJY_1vsG9MTow36k-aiQJkvr8yw09bHlwlm3A1Xo8_UHSjB_fqTtdJKW1XoKhHQ/exec";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Troupe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9E8E4;--card:#fff;--ink:#17181B;--muted:#686B70;--line:#DEDDD8;--soft:#F4F3F0;--blue:#1E3A8A;--blue-soft:#EAEFFA;--ok:#1F6B3A;--err:#A3202A;--wa:#1F8F4E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:14px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 14px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.link{background:none;border:none;padding:8px 0;color:var(--blue);font-weight:600;font-size:14px;cursor:pointer}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
h1{font-size:24px;line-height:1.2;margin:4px 4px 14px;letter-spacing:-.015em}
h2{font-size:15px;margin:0 0 10px}
.lab{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.f{margin-bottom:12px;position:relative}
.f:last-child{margin-bottom:0}
input[type=text],input[type=tel],input[type=email],input[type=search]{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;outline:none;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,58,138,.12)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:14px;border:none;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn.main{background:var(--ink);color:#fff}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}
.hide{display:none!important}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
/* lista a discesa */
.list{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(20,22,26,.14);max-height:260px;overflow-y:auto;z-index:20}
.list li{padding:11px 10px;border-radius:8px;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.list li small{color:var(--muted);font-size:12px;align-self:center}
.list li:hover,.list li.on{background:var(--blue-soft);color:var(--blue)}
/* accesso */
.pin{max-width:320px;margin:9vh auto 0;text-align:center}
.pin .brand{font-size:28px}
.dots{display:flex;justify-content:center;gap:12px;margin:22px 0 8px;height:14px}
.dots span{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink)}
.dots span.on{background:var(--ink)}
.pmsg{min-height:20px;font-size:13px;color:var(--err);margin-bottom:10px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:62px;border-radius:16px;border:none;background:#fff;font-size:22px;font-weight:600;cursor:pointer}
.keys button:active{background:var(--soft)}
.keys .x{background:transparent;font-size:15px}
/* risultati */
.res{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--soft);cursor:pointer}
.res:last-child{border-bottom:none}
.res .t{flex:1;min-width:0}
.res b{display:block;font-size:15px;font-weight:600}
.res small{display:block;color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer}
.chk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bar{position:sticky;bottom:12px;display:flex;gap:10px;margin-top:12px}
.count{font-size:13px;color:var(--muted);margin:0 4px 8px}
/* scheda */
.big{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.acts a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--soft);color:var(--ink);text-decoration:none;font-size:13px;font-weight:600}
.acts a.off{opacity:.35;pointer-events:none}
dl{margin:0}
dt{font-size:12px;color:var(--muted);margin-top:10px}
dt:first-child{margin-top:0}
dd{margin:2px 0 0;font-size:15px;word-break:break-word}
.lock{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);line-height:1.45}
.have{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.have span{font-size:12px;padding:4px 9px;border-radius:20px;background:var(--soft);color:var(--muted)}
.have span.y{background:#E5F2EA;color:var(--ok)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw}
.err{background:#FBECEC;color:var(--err);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
.sec-h h2{margin:0;font-size:17px}
.prj{display:block;width:100%;text-align:left;background:#fff;border:none;border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.prj b{display:block;font-size:16px}
.prj small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stats span{font-size:12px;padding:4px 9px;border-radius:20px;background:var(--soft);color:var(--ink)}
.stats span.w{background:#FFF1D6;color:#7A4B00}
.dep{font-size:13px;font-weight:700;color:var(--muted);margin:16px 4px 6px}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--muted);flex:0 0 auto;white-space:nowrap}
.badge.ok{background:#E5F2EA;color:var(--ok)}.badge.w{background:#FFF1D6;color:#7A4B00}.badge.no{background:#FBECEC;color:var(--err)}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{flex:1;min-height:38px;border:none;border-radius:9px;background:transparent;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 4px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
input[type=date]{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 10px;font-size:16px;background:#fff;-webkit-appearance:none;appearance:none;min-width:0}
select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 10px;font-size:16px;background:#fff}
pre.cl{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.5;margin:0}
.btn.danger{color:var(--err)}
.bad input{border-color:var(--err)}
.fmsg{font-size:12px;color:var(--err);margin-top:4px}
.row>.f{min-width:0}
.step{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--soft)}
.step:first-of-type{border-top:none}
.step .t{flex:1;min-width:0}.step b{display:block;font-size:15px}.step small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tg{width:100%;border-collapse:collapse;font-size:14px}.tg th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:6px 0 8px}.tg th:first-child,.tg td:first-child{text-align:left}.tg td{text-align:right;padding:9px 0;border-top:1px solid var(--soft)}
.btn.mini{width:auto;height:38px;padding:0 14px;font-size:14px;border-radius:11px;flex:0 0 auto}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 40%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:14px;cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none}.chip{position:relative}
.chip:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.chk-row{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:8px;cursor:pointer}
.chk-row input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(20,22,26,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
.sheet .prev{max-height:34vh;overflow:auto;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.add{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:22px;line-height:1;font-weight:500;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;padding:0}
.btn.mini{white-space:nowrap;padding:0 10px}
.res small{white-space:normal}
.add.on{background:var(--ok);border-color:var(--ok);color:#fff;font-size:16px}
.add:disabled{opacity:.5}
.load{text-align:center;color:var(--muted);padding:50px 0;font-size:14px}
</style>
</head>
<body>
<div class="app" id="app"><div class="load">Apro Troupe…</div></div>

<script>
var LINK_SCHEDA = "https://script.google.com/macros/s/AKfycbwJRlfp2wJc1iUXyUsogDX_XTs5rAlOqeXgy2ZrGatSlkEG9gRteOoWLoUCdcXZ9frxMg/exec";
var Q_ = new URLSearchParams(location.search);
var CONF = (Q_.get('invito') || '').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
var MODE = CONF && Q_.get('tipo') === 'cat' ? 'cat' : '';
var ALIAS = {
    'Props Master':'attrezzista capo attrezzista','Props Assistant':'aiuto attrezzista','Props Buyer':'acquisti attrezzeria',
    'Electric':'elettricista','Gaffer':'capo elettricista','Grip':'macchinista','Key Grip':'capo macchinista',
    'Sound Mixer':'fonico presa diretta','Boom Operator':'microfonista asta','Sound Assistant':'assistente fonico',
    'Camera Operator':'operatore di macchina cameraman','1st AC':'aiuto operatore primo assistente operatore fuochista focus',
    '2nd AC':'assistente operatore secondo','Director of Photography':'direttore della fotografia dop dp',
    'Director':'regista regia','1st Assistant Director':'aiuto regia primo aiuto','2nd Assistant Director':'assistente alla regia secondo aiuto',
    'Script Supervisor':'segretaria di edizione edizione','Set Designer':'scenografo scenografia','Set Decorator':'arredatore arredamento',
    'Art Director':'art direction','Stylist':'costumista stylist','Seamstress / Tailor':'sarta sarto',
    'Make-up Artist':'truccatore trucco make up','Hairdresser':'parrucchiere parrucco hair','Driver':'autista furgone',
    'Ncc':'autista noleggio con conducente','Runner':'runner fattorino','PA':'assistente di produzione runner',
    'Production Manager':'direttore di produzione','Production Coordinator':'coordinatore di produzione',
    'Line Producer':'organizzatore generale','Editor':'montatore montaggio','Assistant Editor':'assistente al montaggio',
    'Colorist':'colorista color','Photographer':'fotografo foto','Digitech':'dit digital imaging','Data Manager':'data manager backup',
    'Video Assist Operator':'video assist','Steadicam Operator':'steadicam','Drone Operator':'drone pilota',
    'Location Manager':'location','Casting Director':'casting','Catering/Craft Services':'catering mensa',
    'Security':'sicurezza vigilanza','Interpreter / Translator':'interprete traduttore','Food Stylist':'food',
    'Graphic Designer':'grafico grafica','Music Composer':'compositore musica','Writer':'autore autrice testi',
    'Editorial Team':'redazione redattore autore','Fixer':'fixer','Voice Over':'speaker voce','Painter Greensman':'pittore'
  };
</script>
<script>
(function(){
  var S = { token: null, nome: '', admin: false, view: 'pin', pin: '', msg: '',
            contatti: null, ruoli: [], progetti: null, target: null, pr: null, cv: null, csens: null, q: { ruolo: '', dove: '', nome: '' }, ris: [], sel: {}, cur: null, sens: null };
  try { var t = JSON.parse(localStorage.getItem('troupe') || 'null'); if (t) { S.token = t.token; S.nome = t.nome; S.admin = t.admin; S.view = 'home'; } } catch (e) {}

  var app = document.getElementById('app');
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var norm = function(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); };
  var cap = function(s){ return String(s || '').toLowerCase().replace(/(^|[\s'’-])(\S)/g, function(m, a, b){ return a + b.toUpperCase(); }); };
  var nomeDi = function(c){ return (cap(c.nome) + ' ' + cap(c.cognome)).trim() || c.azienda; };
  var waNum = function(t){ var d = String(t || '').replace(/\D/g, ''); if (!d) return ''; if (d.indexOf('00') === 0) d = d.slice(2); if (d.length <= 10 && d[0] === '3') d = '39' + d; return d; };

  function toast(m){ Array.prototype.forEach.call(document.querySelectorAll('.toast'), function(x){ x.remove(); }); var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2600); }

  // chiamate al server
  function call(fn, args, ok, ko){
    var fail = function(e){
      if (String(e && e.message).indexOf('SESSIONE') !== -1) { esci(true); return; }
      (ko || function(err){ toast('Qualcosa non va: ' + (err && err.message || 'riprova')); })(e);
    };
    if (window.API_URL) {   // versione su GitHub: parla con Google via internet
      fetch(window.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
        .then(function(r){ return r.json(); })
        .then(function(j){ if (j.err) fail(new Error(j.err)); else ok(j.data); })
        .catch(function(){ fail(new Error('Connessione assente, riprova')); });
      return;
    }
    if (typeof google === 'undefined' || !google.script) return window.__mock(fn, args, ok, fail);
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
    r[fn].apply(r, args);
  }

  function salvaSessione(){ try { localStorage.setItem('troupe', JSON.stringify({ token: S.token, nome: S.nome, admin: S.admin })); } catch (e) {} }
  function esci(scaduta){
    if (S.token && !scaduta) call('esci', [S.token], function(){});
    S.token = null; S.contatti = null; S.sens = null; S.view = 'pin'; S.pin = ''; S.msg = scaduta ? 'Sessione scaduta: inserisci di nuovo il codice' : '';
    try { localStorage.removeItem('troupe'); } catch (e) {}
    render();
  }

  function carica(){
    if (S.contatti || S.caricando) return;
    S.caricando = true;
    call('contatti', [S.token], function(c){ S.caricando = false; S.contatti = c; if (S.view === 'home') render(); });
    call('ruoli', [S.token], function(r){ S.ruoli = r; });
  }

  // ───── viste ─────
  function vPin(){
    var d = ''; for (var i = 0; i < 6; i++) d += '<span class="' + (i < S.pin.length ? 'on' : '') + '"></span>';
    var k = [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button data-k="' + n + '">' + n + '</button>'; }).join('');
    return '<div class="pin"><div class="brand">Troupe</div><p class="muted" style="margin-top:6px">Inserisci il tuo codice</p>' +
      '<div class="dots">' + d + '</div><div class="pmsg" role="alert">' + esc(S.msg) + '</div>' +
      '<div class="keys">' + k + '<button class="x" data-k="del" aria-label="Cancella">Cancella</button><button data-k="0">0</button>' +
      '<button class="x" data-k="ok" style="font-weight:700;color:var(--blue)">Entra</button></div></div>';
  }

  function top(back){
    return '<div class="top">' + (back ? '<button class="link" data-go="' + back + '">‹ Indietro</button>' : '<span class="brand">Troupe</span>') +
      '<span class="who">' + esc(S.nome) + (S.admin ? ' · admin' : '') + ' <button class="link" data-act="esci">Esci</button></span></div>';
  }

  function vHome(){
    var n = S.contatti ? S.contatti.length + ' contatti' : 'Carico i contatti…';
    return top() + (S.target ? '<div class="card" style="display:flex;align-items:center;gap:10px;padding:12px 14px"><span class="muted" style="flex:1">Cerca la crew da aggiungere a <b style="color:var(--ink)">' + esc(S.target.titolo) + '</b></span><button class="link" data-act="annullaTarget">Annulla</button></div>' : '') + '<h1>Chi stai cercando?</h1>' +
      '<div class="card"><form id="cerca" autocomplete="off">' +
      '<div class="f"><label class="lab" for="qr">Ruolo</label><input type="search" id="qr" data-ac="ruolo" placeholder="Es. fonico, gaffer, PA" value="' + esc(S.q.ruolo) + '"></div>' +
      '<div class="f"><label class="lab" for="qd">Dove</label><input type="search" id="qd" data-ac="dove" placeholder="Es. Milano" value="' + esc(S.q.dove) + '"></div>' +
      '<div class="f"><label class="lab" for="qn">Nome o cognome</label><input type="search" id="qn" data-ac="nome" placeholder="Facoltativo" value="' + esc(S.q.nome) + '"></div>' +
      '<button class="btn main" type="submit"' + (S.contatti ? '' : ' disabled') + '>Cerca</button>' +
      '<p class="muted" style="text-align:center;margin:10px 0 0">' + n + '</p></form></div>' +
      vProgHome() +
      '<div class="card" style="margin-top:12px"><h2>Nuovo contatto</h2><div class="row">' +
      '<button class="btn wa" data-act="invita">Invita</button><button class="btn sec" data-go="mano">A mano</button></div>' +
      '<p class="muted" style="margin:10px 0 0">Invita manda su WhatsApp il link della scheda: la persona compila da sola.</p></div>';
  }

  function cerca(){
    var r = norm(S.q.ruolo), d = norm(S.q.dove), n = norm(S.q.nome);
    var ruoliOk = null;
    if (r) {
      ruoliOk = {};
      Object.keys(ALIAS).concat(S.ruoli).forEach(function(k){ if (norm(k).indexOf(r) !== -1 || norm(ALIAS[k] || '').indexOf(r) !== -1) ruoliOk[norm(k)] = 1; });
    }
    S.ris = (S.contatti || []).filter(function(c){
      if (r) { var cr = norm(c.ruolo); if (!(cr.indexOf(r) !== -1 || Object.keys(ruoliOk).some(function(k){ return cr.indexOf(k) !== -1; }))) return false; }
      if (d && norm(c.citta).indexOf(d) === -1) return false;
      if (n && norm(c.nome + ' ' + c.cognome + ' ' + c.cognome + ' ' + c.nome + ' ' + c.azienda).indexOf(n) === -1) return false;
      return true;
    }).sort(function(a, b){ return norm(a.cognome).localeCompare(norm(b.cognome)); });
    S.sel = {};
  }

  function vRis(){
    var ns = Object.keys(S.sel).length;
    var righe = S.ris.slice(0, 200).map(function(c){
      var on = S.sel[c.r];
      var dx = S.target ? (S.target.rs[c.r] ? '<span class="add on" title="Già in crew" aria-label="Già in crew">✓</span>' :
          '<button class="add" data-add="' + c.r + '" aria-label="Aggiungi ' + esc(nomeDi(c)) + ' a ' + esc(S.target.titolo) + '">+</button>') :
        '<button class="chk' + (on ? ' on' : '') + '" data-sel="' + c.r + '" aria-label="Seleziona ' + esc(nomeDi(c)) + '">' + (on ? '✓' : '') + '</button>';
      return '<div class="res" data-apri="' + c.r + '"><div class="t"><b>' + esc(nomeDi(c)) + '</b><small>' +
        esc([c.ruolo, c.citta].filter(Boolean).join(' · ')) + '</small></div>' + dx + '</div>';
    }).join('');
    var q = [S.q.ruolo, S.q.dove, S.q.nome].filter(Boolean).join(', ') || 'tutti';
    return top('home') + (S.target ? '<p class="count" style="color:var(--blue);font-weight:600">Tocca + per aggiungere a ' + esc(S.target.titolo) + ', il nome per aprire la scheda</p>' : '') + '<h1>' + S.ris.length + (S.ris.length === 1 ? ' risultato' : ' risultati') + '</h1>' +
      '<p class="count">Per: ' + esc(q) + '</p>' +
      (S.ris.length ? '<div class="card" style="padding:4px 12px">' + righe + '</div>' :
        '<div class="card"><p class="muted" style="margin:0">Nessuno trovato. Prova a togliere un filtro, oppure invita un nuovo contatto dalla Home.</p></div>') +
      (S.ris.length > 200 ? '<p class="count">Mostro i primi 200: aggiungi un filtro per restringere.</p>' : '') +

  function voci(tipo, q){
    q = norm(q); var out = [], vis = {};
    function add(v, hint){ var k = norm(v); if (!v || vis[k]) return; vis[k] = 1; out.push([v, hint || '']); }
    if (tipo === 'ruolo' || tipo === 'ruoloSolo') {
      var tutti = S.ruoli.length ? S.ruoli : Object.keys(ALIAS);
      tutti.forEach(function(r){ if (!q || norm(r).indexOf(q) !== -1) add(r); });
      tutti.forEach(function(r){ var a = ALIAS[r] || ''; if (q && norm(a).indexOf(q) !== -1) add(r, a.split(' ').filter(function(w){ return norm(w).indexOf(q.split(' ')[0]) !== -1; })[0]); });
    } else if (tipo === 'dove') {
      var cnt = {};
      (S.contatti || []).forEach(function(c){ if (c.citta) { var k = c.citta.split(',')[0].trim(); cnt[k] = (cnt[k] || 0) + 1; } });
      Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a]; }).forEach(function(k){ if (!q || norm(k).indexOf(q) !== -1) add(k, cnt[k]); });
    } else if (tipo === 'nome') {
      if (q.length < 2) return [];
      (S.contatti || []).forEach(function(c){ if (norm(c.nome + ' ' + c.cognome + ' ' + c.cognome + ' ' + c.nome).indexOf(q) !== -1) out.push([nomeDi(c), c.ruolo, c]); });
    }
    return out.slice(0, 30);

  var MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  function pd(s){ var p = String(s || '').split('-'); return p.length === 3 ? { y: +p[0], m: +p[1], d: +p[2] } : null; }
  function fmtRange(a, b){
    var x = pd(a), y = pd(b || a); if (!x) return ''; if (!y) y = x;
    if (a === b || !b) return x.d + ' ' + MESI[x.m - 1] + ' ' + x.y;

  var REP = [
    ['Produzione', /producer|production|showrunner|runner|^pa$|driver|ncc|transport|location manager/i],

    ['Luci e macchinisti', /lights|cable|gaffer|grip|electric|lighting/i],
    ['Suono', /sound mixer|boom|sound assistant/i],
    ['Food', /food|catering/i],
    ['Scenografia', /set |set$|art director|props|graphic|painter|builder|decorator/i],
    ['Costumi', /stylist|seamstress|tailor/i],
    ['Trucco e parrucco', /make-up|makeup|hair/i],
    ['Effetti speciali', /sfx|special fx|stunt/i],

  ];
  function repOf(q){ for (var i = 0; i < REP.length; i++) if (REP[i][1].test(q || '')) return REP[i][0]; return 'Altro'; }
  function ordRep(a){ for (var i = 0; i < REP.length; i++) if (REP[i][0] === a) return i; return 99; }
  function crewDi(r){ return (S.pr.crew || []).filter(function(c){ return c.r === r; })[0]; }

  var ODD = {0:1,1:0,2:5,3:7,4:9,5:13,6:15,7:17,8:19,9:21,A:1,B:0,C:5,D:7,E:9,F:13,G:15,H:17,I:19,J:21,K:2,L:4,M:18,N:20,O:11,P:3,Q:6,R:8,S:12,T:14,U:16,V:10,W:22,X:25,Y:24,Z:23};
  function cfOk(v){
    v = String(v).toUpperCase().replace(/\s/g, '');
    if (!/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(v)) return false;
    var s = 0; for (var i = 0; i < 15; i++){ var c = v[i]; s += i % 2 === 0 ? ODD[c] : (/[0-9]/.test(c) ? +c : c.charCodeAt(0) - 65); }
    return String.fromCharCode(65 + s % 26) === v[15];
  }
  function ibanOk(v){
    v = String(v).toUpperCase().replace(/\s/g, '');
    if (!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$/.test(v)) return false;
    if (v.slice(0, 2) === 'IT' && v.length !== 27) return false;
    var r = (v.slice(4) + v.slice(0, 4)).replace(/[A-Z]/g, function(c){ return c.charCodeAt(0) - 55; }), m = 0;
    for (var i = 0; i < r.length; i++) m = (m * 10 + +r[i]) % 97;
    return m === 1;
  }
  function pivaOk(v){
    v = String(v).replace(/\s/g, '').replace(/^IT/i, '');
    if (!/^[0-9]{11}$/.test(v)) return false;
    var s = 0; for (var i = 0; i < 11; i++){ var n = +v[i]; if (i % 2){ n *= 2; if (n > 9) n -= 9; } s += n; }
    return s % 10 === 0;
  }

  function testoCat(){
    var p = S.pr, cat = S.catD || [];

  }

    if (a === 'chiudiPrj') {
      if (!confirm('Chiudere ' + S.pr.titolo + '? La cartella passa in Archivio e i link di conferma smettono di funzionare.')) return true;
      call('chiudiProgetto', [S.token, S.pr.id], function(){ S.progStale = true; S.view = 'home'; render(); toast('Progetto chiuso e archiviato'); });
      return true;
    }
    if (a === 'apriArch') {
      S.arch = null; S.view = 'arch'; render();
      call('archivio', [S.token], function(l){ S.arch = l; if (S.view === 'arch') render(); });
      return true;
    }
    if (a === 'compila') {
      S.adm = null; S.view = 'adminF'; render();
      call('datiPersona', [S.token, S.pr.id, S.cv], function(d){ S.adm = d; if (S.view === 'adminF') render(); }, function(e){ toast(e.message); S.view = 'pers'; render(); });
      return true;
    }
    if (a === 'admAnnulla') { S.view = 'pers'; render(); return true; }
    if (a === 'cf_cat') { confAzione('cat', b); return true; }
    return false;
  }

  function submit3(f){
    if (f.id === 'manF') {
      var d = datiMan();
      var manca = d.filter(function(x){ return !String(x.comp).trim(); });
      if (manca.length) { document.getElementById('manErr').innerHTML = '<div class="err">Manca il compenso di ' + manca.length + (manca.length === 1 ? ' persona' : ' persone') + '.</div>'; return true; }
      var btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Creo il file…';
      call('salvaMandato', [S.token, S.pr.id, d], function(){
        call('mandato', [S.token, S.pr.id], function(r){
          if (!r.ok) { btn.disabled = false; btn.textContent = 'Riprova'; return toast(r.msg); }
          S.invio = r; S.view = 'invio'; ricarica();
        }, function(e){ btn.disabled = false; btn.textContent = 'Riprova'; toast(e.message); });
      }, function(e){ btn.disabled = false; btn.textContent = 'Riprova'; toast(e.message); });
      return true;
    }
    if (f.id === 'admF') {
      var dd = validaDati(f); if (!dd) return true;
      var b2 = f.querySelector('button[type=submit]'); b2.disabled = true; b2.textContent = 'Salvo…';
      call('confermaAdmin', [S.token, S.pr.id, S.cv, dd], function(){ S.view = 'pers'; S.csens = null; ricarica(function(){ toast('Dati salvati e confermati'); }); },
        function(e){ b2.disabled = false; b2.textContent = 'Salva e conferma'; toast(e.message); });
      return true;
    }
    return false;
  }

  function foglioLink(titolo, testo, url){
    chiudiFoglio();
    var o = document.createElement('div'); o.className = 'ov'; o.id = 'foglio';
    o.innerHTML = '<div class="sheet"><h2>' + esc(titolo) + '</h2><p class="muted" style="margin:0 0 12px">' + esc(testo) + '</p>' +
      '<a class="btn main" href="' + esc(url) + '" target="_blank">Apri il file</a><button class="link" style="width:100%;margin-top:6px" data-f="chiudi">Chiudi</button></div>';
    o.addEventListener('click', function(e){ if (e.target === o || e.target.closest('[data-f]')) chiudiFoglio(); });
    document.body.appendChild(o);
  }

  // ═════════ ACCESSI (admin) ═════════
  function vAcc(){
    var d = S.acc;
    if (!d) return top('home') + '<h1>Accessi</h1><div class="load">Carico…</div>';
    var utenti = d.utenti.map(function(x){
      return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b style="font-size:16px">' + esc(x.nome) + '</b>' +
        '<div class="sub" style="margin-top:2px">' + (x.admin ? 'Admin' : 'Producer') + ' · codice <b style="color:var(--ink);letter-spacing:.06em">' + esc(x.codice) + '</b></div></div>' +
        '<span class="badge ' + (x.attivo ? 'ok' : 'no') + '">' + (x.attivo ? 'attivo' : 'disattivato') + '</span></div>' +
        '<div class="row" style="margin-top:12px">' +
        (x.attivo ? '<button class="btn sec mini" style="flex:1" data-act="accInvia" data-row="' + x.row + '">Invia</button>' : '') +
        '<button class="btn sec mini" style="flex:1" data-act="accCodice" data-row="' + x.row + '">Cambia codice</button>' +
        (x.nome === S.nome ? '' : '<button class="btn sec mini' + (x.attivo ? ' danger' : '') + '" style="flex:1" data-act="' + (x.attivo ? 'accOff' : 'accOn') + '" data-row="' + x.row + '">' + (x.attivo ? 'Disattiva' : 'Riattiva') + '</button>') +
        '</div></div>';
    }).join('');
    var reg = d.registro.length ? d.registro.map(function(r){
      return '<div class="res"><div class="t"><b style="font-weight:500">' + esc(r.cosa) + '</b><small>' + esc([r.quando, r.chi, r.persona].filter(Boolean).join(' · ')) + '</small></div></div>';
    }).join('') : '<p class="muted">Ancora niente.</p>';
    return top('home') + '<h1>Accessi</h1>' + utenti +
      '<form id="accF" class="card" autocomplete="off"><h2>Nuovo producer</h2><div id="accErr"></div>' +
      '<div class="f"><label class="lab" for="accN">Nome e cognome</label><input type="text" id="accN" name="nome" placeholder="Es. Giulia Bianchi"></div>' +
      '<button class="btn main" type="submit">Crea accesso</button><p class="muted" style="margin:10px 0 0">Troupe crea un codice personale: vede solo i progetti suoi e i dati di chi ha confermato.</p></form>' +
      '<div class="dep">Registro · ultimi 40</div><div class="card" style="padding:4px 12px">' + reg + '</div>';
  }
  function caricaAcc(){ call('accessi', [S.token], function(d){ S.acc = d; if (S.view === 'acc') { var y = window.scrollY; render(); window.scrollTo(0, y); } }); }
  function utenteRow(row){ return S.acc.utenti.filter(function(x){ return x.row === Number(row); })[0]; }
  function mandaCodice(nome, codice){
    var m = 'Ciao ' + String(nome).split(' ')[0] + ', ecco Troupe, l\'app per crew e collocamenti: ' + S.acc.link +
      '\nIl tuo codice personale è ' + codice + '. Tienilo per te: con quel codice entri a nome tuo.\nSu iPhone: Condividi › Aggiungi alla schermata Home.';
    foglioWA('Codice per ' + nome, m, '');
  }
  function azioni4(a, b){
    if (a === 'apriAcc') { S.acc = null; S.view = 'acc'; render(); caricaAcc(); return true; }
    if (a === 'accInvia') { var u = utenteRow(b.dataset.row); mandaCodice(u.nome, u.codice); return true; }
    if (a === 'accOff' || a === 'accOn' || a === 'accCodice') {
      var u2 = utenteRow(b.dataset.row);
      var q = a === 'accOff' ? 'Disattivare l\'accesso di ' + u2.nome + '? Esce subito da Troupe e il codice smette di funzionare.' :
              a === 'accCodice' ? 'Creare un nuovo codice per ' + u2.nome + '? Il vecchio smette di funzionare' + (u2.nome === S.nome ? ' e dovrai rientrare con il nuovo.' : '.') : '';
      if (q && !confirm(q)) return true;
      b.disabled = true;
      call('cambiaAccesso', [S.token, u2.row, a === 'accOff' ? 'disattiva' : a === 'accOn' ? 'attiva' : 'codice'], function(r){
        if (!r.ok) { b.disabled = false; return toast(r.msg); }
        if (r.io) { alert('Il tuo nuovo codice è ' + r.codice + '. Segnatelo: ora rientri con questo.'); return esci(true); }
        caricaAcc();
        if (r.codice) { u2.codice = r.codice; mandaCodice(u2.nome, r.codice); } else toast(a === 'accOff' ? 'Accesso disattivato' : 'Accesso riattivato');
      }, function(e){ b.disabled = false; toast(e.message); });
      return true;
    }
    return false;
  }
  function submit4(f){
    if (f.id !== 'accF') return false;
    var nome = f.elements.nome.value.trim(), box = document.getElementById('accErr');
    if (nome.split(' ').length < 2) { box.innerHTML = '<div class="err">Scrivi nome e cognome</div>'; return true; }
    var btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Creo…';
    call('creaProducer', [S.token, nome], function(r){
      if (!r.ok) { btn.disabled = false; btn.textContent = 'Crea accesso'; box.innerHTML = '<div class="err">' + esc(r.msg) + '</div>'; return; }
      caricaAcc(); mandaCodice(r.nome, r.codice);
    }, function(e){ btn.disabled = false; btn.textContent = 'Crea accesso'; toast(e.message); });
    return true;
  }

  if (CONF) { S.view = 'conf'; apriConf(); }
  render();
})();
</script>
</body>
</html>
