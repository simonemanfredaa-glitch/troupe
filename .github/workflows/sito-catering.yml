# Pubblica l'app Catering su https://troupe-catering.web.app ogni volta che cambia.
name: Sito Catering
on:
  push:
    branches: [main]
    paths: ['catering.html', 'fb-catering.js', 'pdf-catering.js', 'catering-*.png', 'catering-manifest.json', 'firebase.json']
  workflow_dispatch:
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepara il sito
        run: |
          mkdir -p public
          cp catering.html public/index.html
          cp fb-catering.js pdf-catering.js catering-180.png catering-512.png catering-manifest.json public/
      - name: Chiave di servizio
        env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Domini per l'accesso con Google
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install --no-save google-auth-library@9 >/dev/null
          node .github/scripts/domini.mjs || echo "Domini: da aggiungere a mano"
      - name: Pubblica
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@latest deploy --only hosting:catering --project troupe-app-f0364 --non-interactive
