# Pubblica da solo le regole di sicurezza di Firebase ogni volta che firestore.rules cambia.
name: Regole Firebase
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firestore.indexes.json']
  workflow_dispatch:
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chiave di servizio
        env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$SA" ]; then echo "Manca il secret FIREBASE_SA"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Pubblica le regole
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install --no-save google-auth-library@9 >/dev/null
          node .github/scripts/regole.mjs
          npx -y firebase-tools@latest deploy --only firestore:indexes --project troupe-app-f0364 --non-interactive --force
