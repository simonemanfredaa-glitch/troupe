name: Diagnosi Firebase
on: workflow_dispatch
jobs:
  diagnosi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Controllo
        env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install --no-save google-auth-library@9 >/dev/null
          node .github/scripts/diagnosi.mjs
